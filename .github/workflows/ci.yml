name: CI

on:
  push:
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keep in sync with cmake/FetchSerenity.cmake (SERENITY_PINNED_REF).
      - name: Checkout pinned Serenity
        uses: actions/checkout@v4
        with:
          repository: SerenityOS/serenity
          ref: 7784b1f535a431635443e04d37a9e279ddb9b8eb
          path: deps/serenity

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build git wget gpg \
            libx11-dev libxext-dev # Xlib + XShm (M3)

      # Pin the compiler to Clang 22 from apt.llvm.org. This Serenity pin needs a
      # recent Clang: it relies on __GCC_DESTRUCTIVE_SIZE (AK/Platform.h cache-line
      # alignment) and uses constexpr patterns that older Clang rejects under -Werror.
      # ubuntu-latest's distro clang is too old and breaks the build (see
      # docs/PORTING.md). apt.llvm.org ships 22.1.8, matching the dev environment.
      - name: Install Clang 22 (apt.llvm.org)
        run: |
          CODENAME="$(lsb_release -cs)"
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] https://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME}-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-22 lld-22

      # Clang is required: GCC miscompiles AK::Vector placement-new under
      # -Werror=stringop-overflow (false positive, see docs/PORTING.md).
      - name: Configure
        run: >
          cmake -B Build -G Ninja
          -DCMAKE_C_COMPILER=clang-22 -DCMAKE_CXX_COMPILER=clang++-22
          -DSERENITY_SOURCE_DIR=${{ github.workspace }}/deps/serenity

      - name: Build
        run: cmake --build Build

      - name: Test
        run: ctest --test-dir Build --output-on-failure

  # M5 FreeBSD job. Uses vmactions/freebsd-vm to boot a real FreeBSD VM (QEMU) inside a
  # normal hosted ubuntu-latest runner -- so NO self-hosted FreeBSD machine is needed. The
  # SerenaDE workspace is synced into the VM; the pinned Serenity source is fetched inside the
  # VM (a shallow fetch of the exact commit) to keep that sync small. By design this codebase
  # has no evdev or other Linux-only input path, so the same sources must build here unchanged;
  # the platform-specific fixes live in patches/ (see docs/PORTING.md). KNOWN RISK: the Serenity
  # pin requires C++26 (CMAKE_CXX_STANDARD 26, -Werror; Linux needs Clang 22). Serenity's
  # use_linker.cmake auto-detects ld.lld and forces CMAKE_LINKER_TYPE lld, which the base toolchain
  # rejects ("LINKER_TYPE 'LLD' is unknown or not supported"); we therefore install a self-consistent
  # LLVM via pkg (matching clang + ld.lld) and use its newest clangNN/clang++NN in the run step.
  build-freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build + test in a real FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15" # newest stable line; gives the best shot at a recent-enough clang for C++26
          prepare: |
            pkg install -y bash cmake ninja git curl ca_root_nss pkgconf libX11 libXext coreutils
            # Self-consistent LLVM (matching clang + ld.lld). Serenity's use_linker.cmake auto-detects
            # ld.lld and forces CMAKE_LINKER_TYPE lld, which the base toolchain rejects; a pkg LLVM also
            # gives a newer clang for the pin's C++26. Soft-fail so a missing 'llvm' package name falls
            # back to base clang (the run step prints what it actually found).
            pkg install -y llvm || echo "NOTE: no 'llvm' package; using base clang"
          run: |
            set -e
            # Fetch the pinned Serenity source inside the VM (keep in sync with
            # cmake/FetchSerenity.cmake / SERENITY_PINNED_REF). A shallow fetch of the exact
            # commit is fast and avoids syncing the whole tree from the host.
            rm -rf deps/serenity && git init -q deps/serenity
            git -C deps/serenity remote add origin https://github.com/SerenityOS/serenity.git
            git -C deps/serenity fetch --depth 1 --quiet origin 7784b1f535a431635443e04d37a9e279ddb9b8eb
            git -C deps/serenity checkout -q FETCH_HEAD
            # Use the pkg-installed LLVM if present (newer than base; ships a matching ld.lld so CMake's
            # auto-selected LLD linker type works). Prefer newest versioned clangNN/clang++NN, else the
            # unversioned /usr/local ones, else PATH. The diagnostics make any naming gap obvious in logs.
            CLANG=$(ls /usr/local/bin/clang[0-9]* 2>/dev/null | sort -V | tail -1)
            CLANGXX=$(ls /usr/local/bin/clang++[0-9]* 2>/dev/null | sort -V | tail -1)
            [ -n "$CLANG" ] || CLANG=/usr/local/bin/clang
            [ -x "$CLANG" ] || CLANG=clang
            [ -n "$CLANGXX" ] || CLANGXX=/usr/local/bin/clang++
            [ -x "$CLANGXX" ] || CLANGXX=clang++
            echo "=== toolchain ==="; ls -l /usr/local/bin/clang* /usr/local/bin/ld.lld* 2>&1 | head -30; "$CLANG" --version 2>&1 | head -1
            cmake -B Build -G Ninja \
              -DCMAKE_C_COMPILER="$CLANG" -DCMAKE_CXX_COMPILER="$CLANGXX" \
              -DSERENITY_SOURCE_DIR="$GITHUB_WORKSPACE/deps/serenity"
            cmake --build Build
            # Run the suite as root (GUI tests work fine as root; a non-root user hangs on WindowServer
            # readiness). A timeout caps the test phase so a stuck test can't hang the job forever. On
            # failure, push the full ctest output to a diagnostics branch (the VM workspace is not retained
            # and Actions logs need admin rights to download).
            set +e
            if command -v timeout >/dev/null 2>&1; then
                timeout 1800 ctest --test-dir Build --output-on-failure 2>&1 | tee "$GITHUB_WORKSPACE/Build/ctest-full.log"
            else
                ctest --test-dir Build --output-on-failure 2>&1 | tee "$GITHUB_WORKSPACE/Build/ctest-full.log"
            fi
            ctest_rc=${PIPESTATUS[0]}
            set -e
            if [ "$ctest_rc" -ne 0 ]; then
                echo "===== ctest FAILED (rc=$ctest_rc); pushing full output to ci-diagnostics branch ====="
                cd "$GITHUB_WORKSPACE"
                git config user.email "serenade-ci@users.noreply.github.com"
                git config user.name "SerenaDE CI diagnostics"
                cp Build/ctest-full.log ci-freebsd-ctest.log
                {
                    git add ci-freebsd-ctest.log
                    git commit -q -m "ci: FreeBSD ctest output (diagnostics, do not merge)"
                    git push -q --force origin "HEAD:refs/heads/ci-diagnostics"
                } 2>&1 | tail -5 || echo "NOTE: diagnostic push failed (non-fatal)"
            fi
            exit "$ctest_rc"
