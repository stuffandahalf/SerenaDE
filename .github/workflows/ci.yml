name: CI

on:
  push:
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keep in sync with cmake/FetchSerenity.cmake (SERENITY_PINNED_REF).
      - name: Checkout pinned Serenity
        uses: actions/checkout@v4
        with:
          repository: SerenityOS/serenity
          ref: 7784b1f535a431635443e04d37a9e279ddb9b8eb
          path: deps/serenity

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build git wget gpg \
            libx11-dev libxext-dev # Xlib + XShm (M3)

      # Pin the compiler to Clang 22 from apt.llvm.org. This Serenity pin needs a
      # recent Clang: it relies on __GCC_DESTRUCTIVE_SIZE (AK/Platform.h cache-line
      # alignment) and uses constexpr patterns that older Clang rejects under -Werror.
      # ubuntu-latest's distro clang is too old and breaks the build (see
      # docs/PORTING.md). apt.llvm.org ships 22.1.8, matching the dev environment.
      - name: Install Clang 22 (apt.llvm.org)
        run: |
          CODENAME="$(lsb_release -cs)"
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] https://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME}-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-22 lld-22

      # Clang is required: GCC miscompiles AK::Vector placement-new under
      # -Werror=stringop-overflow (false positive, see docs/PORTING.md).
      - name: Configure
        run: >
          cmake -B Build -G Ninja
          -DCMAKE_C_COMPILER=clang-22 -DCMAKE_CXX_COMPILER=clang++-22
          -DSERENITY_SOURCE_DIR=${{ github.workspace }}/deps/serenity

      - name: Build
        run: cmake --build Build

      - name: Test
        run: ctest --test-dir Build --output-on-failure

  # M5 FreeBSD job. GitHub has no hosted FreeBSD runner, so this targets a
  # self-hosted one and is gated by the repo variable FREEBSD_CI_ENABLED (default off):
  # it stays inert until a [self-hosted, freebsd] runner is provisioned AND the variable
  # is set to "true" in the repo settings -- otherwise every push would queue forever
  # waiting for a runner that does not exist. By design this codebase has no evdev or other
  # Linux-only input path, so the same sources must configure and build here unchanged; the
  # only platform-specific portability fixes live in patches/ (see docs/PORTING.md).
  # Package names/versions below are for a recent FreeBSD (13/14) and may need adjusting per
  # release; the Serenity pin needs a recent Clang (>= 22 on Linux), so install one if the
  # base clang is too old.
  build-freebsd:
    runs-on: [self-hosted, freebsd]
    if: ${{ vars.FREEBSD_CI_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      # Keep in sync with cmake/FetchSerenity.cmake (SERENITY_PINNED_REF).
      - name: Checkout pinned Serenity
        uses: actions/checkout@v4
        with:
          repository: SerenityOS/serenity
          ref: 7784b1f535a431635443e04d37a9e279ddb9b8eb
          path: deps/serenity

      - name: Install dependencies
        run: |
          pkg install -y cmake ninja git llvm18 libX11

      - name: Configure
        run: >
          cmake -B Build -G Ninja
          -DCMAKE_C_COMPILER=clang18 -DCMAKE_CXX_COMPILER=clang++18
          -DSERENITY_SOURCE_DIR=${{ github.workspace }}/deps/serenity

      - name: Build
        run: cmake --build Build

      - name: Test
        run: ctest --test-dir Build --output-on-failure
